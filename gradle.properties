kotlin.code.style=official

#Gradle
kotlin.daemon.jvmargs=-Xmx8g -XX:MetaspaceSize=2g
org.gradle.jvmargs=-Xmx8g -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC
# -Dkotlin.daemon.jvm.options\="-Xmx2048M"
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallell=true

#Compose
#org.jetbrains.compose.experimental.uikit.enabled=true

#Compose for Web is Experimental
org.jetbrains.compose.experimental.wasm.enabled=true

#Android
android.useAndroidX=true
android.nonTransitiveRClass=true

#MPP
#kotlin.mpp.androidSourceSetLayoutVersion=2
#kotlin.mpp.enableCInteropCommonization=true

#Development
#development=true